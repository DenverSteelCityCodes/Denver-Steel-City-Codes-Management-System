# Weekly production backup (docs/runbooks/free-tier-operations.md). The free tier has no backups,
# so this dumps roles, schema and data with the Supabase CLI, encrypts the bundle with a passphrase
# that only lives in GitHub secrets, and uploads it to a private S3-compatible bucket (Cloudflare
# R2). It keeps the newest BACKUP_KEEP copies and deletes older ones, so data an admin deletes is
# gone from backups within that many weeks (spec L4). The dump holds minors' data: it is never
# uploaded as a workflow artifact, because anyone can download artifacts from a public repo.
# Skipped until PROD_DB_URL is set; the demo resets nightly, so it isn't backed up.
name: Database backup

on:
  schedule:
    - cron: '41 9 * * 0'   # Sundays, 09:41 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: database-backup
  cancel-in-progress: false

jobs:
  backup:
    name: Dump, encrypt, upload
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash   # adds -o pipefail, so a failed dump or tar stops the pipe
    env:
      DB_URL: ${{ secrets.PROD_DB_URL }}
      BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
      BACKUP_S3_ENDPOINT: ${{ secrets.BACKUP_S3_ENDPOINT }}
      BACKUP_S3_BUCKET: ${{ secrets.BACKUP_S3_BUCKET }}
      AWS_ACCESS_KEY_ID: ${{ secrets.BACKUP_S3_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_S3_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      # R2 rejects the checksum headers newer AWS CLI versions send by default.
      AWS_REQUEST_CHECKSUM_CALCULATION: when_required
      AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
      BACKUP_KEEP: 4
      PREFIX: scc-prod/
    steps:
      - name: Check configuration
        id: config
        run: |
          if [ -z "$DB_URL" ]; then
            echo "::notice::PROD_DB_URL not set, no production project to back up yet. Skipped."
            echo "run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          missing=""
          for name in BACKUP_PASSPHRASE BACKUP_S3_ENDPOINT BACKUP_S3_BUCKET AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::PROD_DB_URL is set but these are missing:$missing (AWS_* come from the BACKUP_S3_* secrets)"
            exit 1
          fi
          if [ "${#BACKUP_PASSPHRASE}" -lt 24 ]; then
            echo "::error::BACKUP_PASSPHRASE must be at least 24 characters"
            exit 1
          fi
          echo "run=true" >> "$GITHUB_OUTPUT"

      - if: steps.config.outputs.run == 'true'
        uses: supabase/setup-cli@v1
        with:
          version: 2.106.0

      - name: Dump roles, schema and data
        if: steps.config.outputs.run == 'true'
        run: |
          umask 077
          mkdir dump
          supabase db dump --db-url "$DB_URL" --role-only -f dump/roles.sql
          supabase db dump --db-url "$DB_URL" -f dump/schema.sql
          supabase db dump --db-url "$DB_URL" --data-only --use-copy -f dump/data.sql
          # An empty or truncated dump must fail loudly, not replace a good backup.
          grep -q 'CREATE TABLE' dump/schema.sql
          grep -Eq '^COPY "?auth"?\."?users"? ' dump/data.sql
          ls -l dump

      - name: Encrypt and check it decrypts
        if: steps.config.outputs.run == 'true'
        run: |
          umask 077
          name="scc-prod-$(date -u +%Y-%m-%dT%H%MZ).tar.gz.gpg"
          tar -czf - -C dump . | gpg --batch --yes --pinentry-mode loopback --symmetric \
            --cipher-algo AES256 --passphrase-fd 3 -o "$name" 3<<<"$BACKUP_PASSPHRASE"
          rm -rf dump
          gpg --batch --pinentry-mode loopback --decrypt --passphrase-fd 3 "$name" 3<<<"$BACKUP_PASSPHRASE" \
            | tar -tzf - | sort
          echo "NAME=$name" >> "$GITHUB_ENV"

      - name: Upload and prune
        if: steps.config.outputs.run == 'true'
        run: |
          s3() { aws s3 --endpoint-url "$BACKUP_S3_ENDPOINT" "$@"; }
          s3 cp --only-show-errors "$NAME" "s3://$BACKUP_S3_BUCKET/$PREFIX$NAME"
          rm -f "$NAME"
          # Names sort by date. Keep the newest BACKUP_KEEP, delete the rest.
          s3 ls "s3://$BACKUP_S3_BUCKET/$PREFIX" | awk '{print $4}' | grep '^scc-prod-.*\.tar\.gz\.gpg$' | sort > all.txt
          echo "Stored backups:"; cat all.txt
          total=$(wc -l < all.txt)
          awk -v cut="$(( total - BACKUP_KEEP ))" 'NR <= cut' all.txt | while read -r old; do
            echo "Deleting $old"
            s3 rm --only-show-errors "s3://$BACKUP_S3_BUCKET/$PREFIX$old"
          done
