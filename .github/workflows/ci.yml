# CI (spec 08, #76): lint, unit tests and a production build on every pull request and every
# push to main. The SQL/RLS suites in test-plans/ still run against the demo (or local) database
# by hand; spec 08's remaining work is to run them here on `supabase start` + `db reset`
# (migrations already live in supabase/migrations/ after spec 01).
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
        env:
          TZ: Asia/Tokyo   # camp times must not depend on the machine's time zone
      - run: npm run build
