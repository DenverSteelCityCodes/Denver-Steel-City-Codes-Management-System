<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Steel City Codes // Denver</title>

    <!-- Theme before first paint (DESIGN.md): the saved choice, else the OS setting. Runs before
         CSS so no page flashes light, and signed-out pages follow the same theme as signed-in ones. -->
    <script>
      (function () {
        var dark = false
        try {
          var saved = localStorage.getItem('scc-theme')
          dark = saved ? saved === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches
        } catch (e) { /* private mode: follow the light default */ }
        var root = document.documentElement
        root.classList.toggle('dark', dark)
        root.style.colorScheme = dark ? 'dark' : 'light'
      })()
    </script>

    <!-- Fonts (DESIGN.md): Atkinson Hyperlegible Next for the UI, Josefin Sans 700 for page titles only. -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;600;700;800&family=Josefin+Sans:wght@700&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
